plugins { id 'com.android.application' }

android {
    namespace 'io.stairpilot'
    compileSdk 35
    defaultConfig {
        applicationId 'io.stairpilot.mobile'
        minSdk 29
        targetSdk 35
        versionCode 7
        versionName '1.6.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
