name: Build MineMaster KR from source ZIP
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Unpack project
        run: |
          mkdir -p source
          unzip -q MMKR51.zip -d source
          test -f source/app/build.gradle.kts
      - name: Build APK
        run: gradle --no-daemon --stacktrace -p source :app:assembleDebug
      - name: Check APK signature
        run: |
          APK=source/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: MineMaster-KR-Android16-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
