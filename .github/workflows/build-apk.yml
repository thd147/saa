name: Build Android debug APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test logic (no Android SDK required)
        run: |
          mkdir -p tests/build
          javac -d tests/build app/src/main/java/io/stairpilot/DecisionEngine.java app/src/main/java/io/stairpilot/PromptGate.java app/src/main/java/io/stairpilot/ModeProfile.java app/src/main/java/io/stairpilot/AdaptivePacer.java app/src/main/java/io/stairpilot/RunGuard.java app/src/main/java/io/stairpilot/GaugeDetector.java app/src/main/java/io/stairpilot/GaugePacer.java tests/DecisionEngineTest.java tests/PromptGateTest.java tests/AdaptivePacerTest.java tests/RunGuardTest.java tests/GaugeDetectorTest.java tests/GaugePacerTest.java tests/LongClimbSimulationTest.java
          java -cp tests/build DecisionEngineTest
          java -cp tests/build PromptGateTest
          java -cp tests/build AdaptivePacerTest
          java -cp tests/build RunGuardTest
          java -cp tests/build GaugeDetectorTest
          java -cp tests/build GaugePacerTest
          java -cp tests/build LongClimbSimulationTest
      - name: Build
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: StairPilot-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
