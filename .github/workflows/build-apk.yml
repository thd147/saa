name: Build Android debug APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Three independent test cycles (static + Java + synthetic archives)
        run: |
          for cycle in 1 2 3; do
            echo "=============== MUGYE v1.6 cycle $cycle / 3 ==============="
            python3 scripts/check_project.py
            python3 tests/test_apk_audit.py
            mkdir -p tests/build
            javac -encoding UTF-8 -d tests/build \
              app/src/main/java/io/stairpilot/{DecisionEngine,PromptGate,ModeProfile,AdaptivePacer,RunGuard,GaugeDetector,GaugePacer}.java \
              preview/src/main/java/io/mugye/preview/InstallGuide.java tests/*.java
            for test in DecisionEngineTest PromptGateTest AdaptivePacerTest RunGuardTest GaugeDetectorTest GaugePacerTest LongClimbSimulationTest InstallGuideTest; do
              java -cp tests/build "$test"
            done
          done
      - name: Build both Android applications
        run: gradle --no-daemon :app:assembleDebug :preview:assembleDebug
      - name: Audit built APK archives, package IDs, permissions, certificates
        run: |
          python3 scripts/audit_apk.py \
            --macro app/build/outputs/apk/debug/app-debug.apk \
            --preview preview/build/outputs/apk/debug/preview-debug.apk \
            --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            --output build/reports/MUGYE-v1.6-APK-AUDIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MugyeMacro-v1.6-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: MugyePreview-v1.6-safe-apk
          path: preview/build/outputs/apk/debug/preview-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Mugye-v1.6-apk-audit-report
          path: build/reports/MUGYE-v1.6-APK-AUDIT.txt
          if-no-files-found: error
